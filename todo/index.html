<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Lista de tareas</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; padding: 0.25rem 0; }
    li.completed span { text-decoration: line-through; color: #888; }
    button.delete { margin-left: auto; }
  </style>
</head>
<body>
  <h1>Lista de tareas</h1>
  <input id="new-task" type="text" placeholder="Nueva tarea" />
  <button id="add-btn">Agregar</button>
  <ul id="task-list"></ul>
  <script src="todo.js"></script>
</body>
</html>
